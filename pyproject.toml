[project]
name = "nexojuris-conversor"
version = "1.4.7"
description = "Conversor local de PDF para Markdown estruturado do ecossistema NexoJuris."
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.1",
    "deep-translator>=1.11.4",
    "edge-tts>=7.2.8",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.0",
    "pymupdf4llm==1.28.0",
    "pypdf>=6.16.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "pywebview>=6.2.1",
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
