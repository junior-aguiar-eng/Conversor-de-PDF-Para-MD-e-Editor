[project]
name = "boni-pdf-para-markdown"
version = "0.1.0"
description = "Conversor local e leve de PDFs digitais para Markdown"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pymupdf4llm==1.28.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
