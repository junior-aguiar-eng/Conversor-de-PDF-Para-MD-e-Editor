<title>Leitura editorial</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#172535;background:#f4f5f7;font:17px/1.7 Georgia,serif;overflow-wrap:anywhere}
aside{position:fixed;width:290px;inset:0 auto 0 0;overflow:auto;background:#102a43;color:#eff6fc;padding:24px 20px;font:13px/1.55 system-ui}
aside h2{font-size:18px;color:#eff6fc}aside a{color:#d8e9f7;display:block;text-decoration:none;padding:5px 0}aside a:hover,aside a:focus{color:white;text-decoration:underline}
main{max-width:990px;margin:0 24px 0 314px;background:white;padding:48px 60px;min-height:100vh}
header{font:14px/1.6 system-ui;color:#526577;border-bottom:1px solid #ccd8df;padding-bottom:22px;margin-bottom:36px}
h1,h2,h3,h4,h5,h6{font-family:system-ui;line-height:1.3;color:#123a59;scroll-margin-top:24px}h1{font-size:30px;margin:52px 0 25px}h2{font-size:24px;margin-top:40px}h3{font-size:21px;margin-top:32px}h4,h5,h6{font-size:18px;margin-top:28px}p{margin:17px 0}
blockquote{margin:24px 0;padding:14px 22px;border-left:4px solid #317ba3;background:#f0f6fa;font-size:16px}blockquote p{margin:5px 0}
table{border-collapse:collapse;width:100%;font:14px/1.55 system-ui;margin:25px 0;table-layout:fixed}th,td{border:1px solid #bdcbd6;padding:12px;vertical-align:top;overflow-wrap:anywhere}th{background:#e9f0f6}tr:nth-child(even){background:#f7f9fa}mark{background:#fff0a8}u{text-decoration-thickness:1px}img{max-width:100%;height:auto}pre{overflow:auto;padding:16px;background:#f0f4f7;white-space:pre-wrap}button{cursor:pointer;border:1px solid #b9cad6;background:white;padding:7px 15px;color:#234966;border-radius:5px}.warning{border-left:4px solid #ac7310;padding:10px;background:#fff5db;white-space:pre-line}
@media(max-width:1050px){aside{width:235px}main{margin-left:250px;padding:30px}}@media(max-width:750px){aside{position:static;width:auto;max-height:250px}main{margin:0;padding:22px}}@media print{aside,button{display:none}main{margin:0;max-width:none;padding:0}body{background:white}h1,h2,h3,h4{break-after:avoid}table,blockquote{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<aside aria-label="Índice de assuntos"><h2>Mapa de leitura</h2><p>Selecione um assunto para navegar.</p><nav id="toc" aria-label="Seções do documento"></nav></aside>
